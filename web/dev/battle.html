<!doctype html>
<meta charset="utf-8">
<title>rollmons battle worker</title>
<style>
  body { font-family: ui-monospace, monospace; padding: 1rem; max-width: 74rem; margin: 0 auto; }
  textarea { width: 100%; height: 9rem; font: inherit; }
  pre { white-space: pre-wrap; background: #f4f4f4; padding: .5rem; max-height: 20rem; overflow: auto; }
  .row { display: flex; gap: 1rem; } .row > div { flex: 1; }
  #summary { font-family: system-ui, sans-serif; }
</style>
<h1>battle worker dev page</h1>
<p id="status">loading worker…</p>
<div class="row">
  <div><label>p1 (Showdown export)<textarea id="p1"></textarea></label></div>
  <div><label>p2 (Showdown export)<textarea id="p2"></textarea></label></div>
</div>
<p>
  boss name <input id="boss" value="Leon" style="width:8rem">
  seed <input id="seed" type="number" value="1" style="width:5rem">
  p1 ms <input id="b1" type="number" value="100" style="width:5rem">
  p2 ms <input id="b2" type="number" value="25" style="width:5rem">
  <button id="run" disabled>run battle</button>
</p>
<p id="summary"></p>
<div id="replay"></div>
<pre id="trace"></pre>
<pre id="log"></pre>
<script type="module" src="../dist/battle-page.js"></script>
